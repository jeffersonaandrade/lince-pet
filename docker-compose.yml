services:
  postgres:
    image: postgres:16-alpine
    container_name: lincepet-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: lincepet
      POSTGRES_PASSWORD: lincepet
      POSTGRES_DB: lincepet
    volumes:
      - lincepet_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lincepet -d lincepet"]
      interval: 2s
      timeout: 5s
      retries: 20

  # Aplica as migrations e encerra. Não roda o seed.
  # A URL usa o hostname da rede do Compose. O Next, na máquina, continua no .env (porta 5433).
  migrate:
    build:
      context: .
      dockerfile: docker/migrate/Dockerfile
    environment:
      DATABASE_URL: postgresql://lincepet:lincepet@postgres:5432/lincepet
      DIRECT_URL: postgresql://lincepet:lincepet@postgres:5432/lincepet
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  lincepet_pg:
