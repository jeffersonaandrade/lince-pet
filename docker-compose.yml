services:
  postgres:
    image: postgres:16-alpine
    container_name: lincepet-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: lincepet
      POSTGRES_PASSWORD: lincepet
      POSTGRES_DB: lincepet
    volumes:
      - lincepet_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lincepet -d lincepet"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  lincepet_pg:
